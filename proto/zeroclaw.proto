syntax = "proto3";
package zeroclaw;

// ═══════════════════════════════════════════════
// Core Chat
// ═══════════════════════════════════════════════

service ClawAgent {
  // Send a message and receive a server-stream of deltas, tool events, and final response.
  rpc SendMessage (SendMessageRequest) returns (stream ChatOutput);

  // Cancel the currently running turn (if any).
  rpc CancelTurn (CancelTurnRequest) returns (CancelTurnResponse);

  // Get conversation history (paginated).
  rpc GetHistory (HistoryRequest) returns (HistoryResponse);

  // Clear conversation history and reset agent state.
  rpc ClearHistory (ClearHistoryRequest) returns (ClearHistoryResponse);

  // ═══════════════════════════════════════════════
  // Status & Health
  // ═══════════════════════════════════════════════

  rpc GetStatus (GetStatusRequest) returns (StatusResponse);
  rpc HealthCheck (HealthCheckRequest) returns (HealthResponse);

  // ═══════════════════════════════════════════════
  // Configuration
  // ═══════════════════════════════════════════════

  rpc GetConfig (GetConfigRequest) returns (ConfigResponse);
  rpc UpdateConfig (UpdateConfigRequest) returns (UpdateConfigResponse);

  // ═══════════════════════════════════════════════
  // Memory
  // ═══════════════════════════════════════════════

  rpc ListMemory (ListMemoryRequest) returns (MemoryEntryList);
  rpc SearchMemory (SearchMemoryRequest) returns (MemoryEntryList);
  rpc StoreMemory (StoreMemoryRequest) returns (StoreMemoryResponse);
  rpc ForgetMemory (ForgetMemoryRequest) returns (ForgetMemoryResponse);

  // ═══════════════════════════════════════════════
  // Tools
  // ═══════════════════════════════════════════════

  rpc ListTools (ListToolsRequest) returns (ToolList);

  // ═══════════════════════════════════════════════
  // Events (observability stream)
  // ═══════════════════════════════════════════════

  rpc SubscribeEvents (SubscribeEventsRequest) returns (stream AgentEvent);
}

// ═══════════════════════════════════════════════
// Chat Messages
// ═══════════════════════════════════════════════

message SendMessageRequest {
  string message = 1;
}

message ChatOutput {
  string turn_id = 1;
  oneof output {
    string delta = 2;
    ToolCallStarted tool_start = 3;
    ToolCallResult tool_result = 4;
    TurnComplete done = 5;
    TurnError error = 6;
    QueuePosition queued = 7;
    TurnStarted turn_start = 8;
    AgentStatus status = 9;
  }
}

message CancelTurnRequest {}
message CancelTurnResponse {
  bool was_running = 1;
  string turn_id = 2;
}

message ToolCallStarted {
  string tool = 1;
  string arguments = 2;
}

message ToolCallResult {
  string tool = 1;
  bool success = 2;
  string output = 3;
}

message TurnComplete {
  string content = 1;
  uint64 turn_index = 2;
  uint64 input_tokens = 3;
  uint64 output_tokens = 4;
}

message TurnError {
  string message = 1;
}

message QueuePosition {
  uint32 position = 1;
}

message TurnStarted {
  uint64 turn_index = 1;
}

message AgentStatus {
  bool busy = 1;
  uint64 current_turn_index = 2;
  uint64 history_length = 3;
}

// ═══════════════════════════════════════════════
// History
// ═══════════════════════════════════════════════

message HistoryRequest {
  uint64 offset = 1;
  uint64 limit = 2;
}

message HistoryResponse {
  uint64 total = 1;
  uint64 offset = 2;
  uint64 limit = 3;
  repeated HistoryEntry messages = 4;
}

message HistoryEntry {
  uint64 turn_index = 1;
  string role = 2;
  string content = 3;
  string created_at = 4;
}

message ClearHistoryRequest {
  bool confirm = 1;
}

message ClearHistoryResponse {
  uint64 messages_cleared = 1;
}

// ═══════════════════════════════════════════════
// Status
// ═══════════════════════════════════════════════

message GetStatusRequest {}
message StatusResponse {
  string state = 1;
  uint64 uptime_secs = 2;
  uint64 total_turns = 3;
  uint64 history_length = 4;
  string model = 5;
  string provider = 6;
}

message HealthCheckRequest {}
message HealthResponse {
  bool healthy = 1;
  string version = 2;
}

// ═══════════════════════════════════════════════
// Configuration
// ═══════════════════════════════════════════════

message GetConfigRequest {}
message ConfigResponse {
  string config_json = 1;
}

message UpdateConfigRequest {
  string partial_json = 1;
}

message UpdateConfigResponse {
  repeated string updated_fields = 1;
  bool requires_restart = 2;
}

// ═══════════════════════════════════════════════
// Memory
// ═══════════════════════════════════════════════

message ListMemoryRequest {
  string category = 1;
  uint64 offset = 2;
  uint64 limit = 3;
}

message SearchMemoryRequest {
  string query = 1;
  uint64 limit = 2;
}

message StoreMemoryRequest {
  string key = 1;
  string content = 2;
  string category = 3;
}

message StoreMemoryResponse {}

message ForgetMemoryRequest {
  string key = 1;
}

message ForgetMemoryResponse {}

message MemoryEntry {
  string key = 1;
  string content = 2;
  string category = 3;
  string timestamp = 4;
  double score = 5;
}

message MemoryEntryList {
  repeated MemoryEntry entries = 1;
  uint64 total = 2;
}

// ═══════════════════════════════════════════════
// Tools
// ═══════════════════════════════════════════════

message ListToolsRequest {}
message ToolSpecProto {
  string name = 1;
  string description = 2;
  string parameters_json = 3;
}

message ToolList {
  repeated ToolSpecProto tools = 1;
}

// ═══════════════════════════════════════════════
// Events
// ═══════════════════════════════════════════════

message SubscribeEventsRequest {}
message AgentEvent {
  string event_type = 1;
  string data_json = 2;
  string timestamp = 3;
}
