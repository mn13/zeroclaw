[package]
name = "zcgw"
version = "0.1.0"
edition = "2021"
description = "ZeroClaw Gateway — lightweight multi-instance orchestrator"

[[bin]]
name = "zcgw"
path = "src/main.rs"

[dependencies]
# gRPC
tonic = "0.12"
prost = "0.13"
tokio-stream = "0.1"

# HTTP server
axum = { version = "0.8", features = ["ws", "json", "query", "macros"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "timeout"] }

# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Misc
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
toml = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "ansi", "env-filter", "json"] }
uuid = { version = "1", features = ["v4"] }
futures-util = "0.3"
rusqlite = { version = "0.37", features = ["bundled"] }
url = "2"
urlencoding = "2"

[build-dependencies]
tonic-build = "0.12"
