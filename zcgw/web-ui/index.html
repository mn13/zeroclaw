<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ZeroClaw Gateway</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&family=Outfit:wght@300;400;500;600;700&family=Syne:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --amber: #F59E0B;
  --amber-dim: #92600a;
  --amber-bright: #FBBF24;
  --amber-glow: rgba(245,158,11,0.15);
  --bg-dark: #0a0a0a;
  --bg-card: #111111;
  --bg-sidebar: #070707;
  --bg-input: #0d0d0d;
  --border: #1f1f1f;
  --border-amber: rgba(245,158,11,0.3);
  --text-primary: #e5e5e5;
  --text-dim: #737373;
  --error-text: #fca5a5;
  --error-bg: rgba(220,38,38,0.1);
  --success: #22c55e;
  --row-hover: rgba(255,255,255,0.02);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; }
body {
  font-family: 'Outfit', sans-serif;
  background: var(--bg-dark);
  color: var(--text-primary);
  display: flex;
  height: 100vh;
}

::-webkit-scrollbar { width: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--amber-dim); border-radius: 4px; }
::selection { background: var(--amber); color: #000; }

body::after {
  content: '';
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 9999;
  background: radial-gradient(ellipse at center, transparent 0%, rgba(0,0,0,0.15) 100%),
    repeating-linear-gradient(0deg, transparent, transparent 23px, rgba(255,255,255,0.008) 23px, rgba(255,255,255,0.008) 24px);
}

.clip { clip-path: polygon(10px 0%, 100% 0%, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0% 100%, 0% 10px); }
.clip-sm { clip-path: polygon(6px 0%, 100% 0%, 100% calc(100% - 6px), calc(100% - 6px) 100%, 0% 100%, 0% 6px); }

#sidebar {
  width: 56px; min-width: 56px;
  background: var(--bg-sidebar);
  border-right: 1px solid var(--border);
  display: flex; flex-direction: column;
  transition: width 0.25s ease, min-width 0.25s ease;
  overflow: hidden; z-index: 10;
}
#sidebar.expanded { width: 220px; min-width: 220px; }
#sidebar .logo {
  padding: 16px 14px; display: flex; align-items: center; gap: 10px;
  cursor: pointer; border-bottom: 1px solid var(--border);
}
#sidebar .logo-icon {
  font-family: 'Syne', sans-serif; font-weight: 800; font-size: 18px;
  color: var(--amber); min-width: 28px; text-align: center;
}
#sidebar .logo-text {
  font-family: 'Syne', sans-serif; font-weight: 700; font-size: 13px;
  color: var(--text-primary); letter-spacing: 2px; white-space: nowrap;
  opacity: 0; transition: opacity 0.2s;
}
#sidebar.expanded .logo-text { opacity: 1; }

.nav-item {
  display: flex; align-items: center; gap: 12px; padding: 10px 16px;
  cursor: pointer; border-left: 2px solid transparent; transition: all 0.15s; white-space: nowrap;
}
.nav-item:hover { background: var(--row-hover); color: var(--amber-bright); }
.nav-item.active {
  border-left-color: var(--amber); background: rgba(245,158,11,0.08); color: var(--amber-bright);
}
.nav-icon {
  font-family: 'JetBrains Mono', monospace; font-size: 15px; min-width: 24px;
  text-align: center; color: var(--text-dim);
}
.nav-item.active .nav-icon, .nav-item:hover .nav-icon { color: var(--amber); }
.nav-label {
  font-family: 'Syne', sans-serif; font-size: 11px; font-weight: 600;
  letter-spacing: 1.5px; text-transform: uppercase; opacity: 0; transition: opacity 0.2s;
}
#sidebar.expanded .nav-label { opacity: 1; }

#sidebar-bottom {
  margin-top: auto; padding: 12px; border-top: 1px solid var(--border);
}
#sidebar-status {
  display: flex; align-items: center; gap: 8px;
  font-family: 'JetBrains Mono', monospace; font-size: 9px;
  letter-spacing: 1px; text-transform: uppercase; color: var(--text-dim);
  white-space: nowrap; overflow: hidden;
}
.status-dot {
  width: 6px; height: 6px; border-radius: 50%; background: var(--text-dim); flex-shrink: 0;
}
.status-dot.healthy { background: var(--success); box-shadow: 0 0 8px rgba(34,197,94,0.5); }
.status-dot.unhealthy { background: #ef4444; box-shadow: 0 0 8px rgba(239,68,68,0.5); }

#main { flex: 1; display: flex; flex-direction: column; overflow: hidden; min-width: 0; }

#header {
  padding: 14px 28px; background: var(--bg-card); border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 16px;
}
#page-title {
  font-family: 'Syne', sans-serif; font-size: 16px; font-weight: 700; letter-spacing: 1px;
}
#instance-selector {
  margin-left: auto; display: flex; align-items: center; gap: 8px;
}
#instance-selector label {
  font-family: 'JetBrains Mono', monospace; font-size: 10px;
  letter-spacing: 1px; text-transform: uppercase; color: var(--text-dim);
}
#instance-select {
  font-family: 'JetBrains Mono', monospace; font-size: 12px; padding: 6px 12px;
  background: var(--bg-input); border: 1px solid var(--border); color: var(--amber);
  cursor: pointer; outline: none;
}
#instance-select:focus { border-color: var(--amber); }

#content { flex: 1; overflow-y: auto; padding: 24px 28px; }

#login-view {
  display: flex; align-items: center; justify-content: center; height: 100%;
}
.login-card {
  background: var(--bg-card); border: 1px solid var(--border);
  padding: 40px; width: 380px; text-align: center;
}
.login-card h2 {
  font-family: 'Syne', sans-serif; font-size: 22px; font-weight: 800;
  color: var(--amber); margin-bottom: 6px; letter-spacing: 2px;
}
.login-card p { font-size: 13px; color: var(--text-dim); margin-bottom: 28px; }
.login-card input {
  width: 100%; font-family: 'JetBrains Mono', monospace; font-size: 14px;
  padding: 12px 14px; background: var(--bg-input); border: 1px solid var(--border);
  color: var(--text-primary); margin-bottom: 16px; outline: none; text-align: center; letter-spacing: 2px;
}
.login-card input:focus { border-color: var(--amber); }
.login-card button {
  width: 100%; font-family: 'JetBrains Mono', monospace; font-size: 12px;
  font-weight: 700; letter-spacing: 2px; text-transform: uppercase; padding: 12px;
  background: var(--amber); color: #000; border: none; cursor: pointer; transition: background 0.15s;
}
.login-card button:hover { background: var(--amber-bright); }
.login-error {
  color: var(--error-text); font-size: 12px; margin-top: 12px;
  font-family: 'JetBrains Mono', monospace;
}

#chat-view { display: flex; flex-direction: column; height: 100%; }
#chat-messages {
  flex: 1; overflow-y: auto; display: flex; flex-direction: column;
  gap: 4px; padding-bottom: 16px;
}
.chat-msg {
  display: flex; gap: 12px; padding: 10px 14px; border-left: 2px solid transparent;
}
.chat-msg.role-assistant { border-left-color: var(--amber-dim); background: rgba(245,158,11,0.03); }
.chat-msg .msg-sender {
  font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 600;
  letter-spacing: 1px; text-transform: uppercase; min-width: 36px; padding-top: 2px;
  color: var(--text-dim);
}
.chat-msg.role-assistant .msg-sender { color: var(--amber); }
.chat-msg .msg-content {
  flex: 1; font-size: 13.5px; line-height: 1.65; white-space: pre-wrap; word-break: break-word;
}

.tool-card {
  background: var(--bg-input); border: 1px solid var(--border);
  margin: 6px 0; padding: 10px 14px; font-family: 'JetBrains Mono', monospace; font-size: 11px;
}
.tool-card-header { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
.tool-card-icon { color: var(--amber); font-size: 12px; }
.tool-card-name {
  font-weight: 600; color: var(--amber-bright); text-transform: uppercase; letter-spacing: 0.5px;
}
.tool-card-status {
  margin-left: auto; font-size: 10px; letter-spacing: 1px; text-transform: uppercase;
}
.tool-card-status.running { color: var(--amber); }
.tool-card-status.success { color: var(--success); }
.tool-card-status.fail { color: var(--error-text); }
.tool-card-body {
  color: var(--text-dim); font-size: 10px; line-height: 1.5;
  max-height: 120px; overflow-y: auto; white-space: pre-wrap; word-break: break-all;
}
.tool-card-toggle {
  color: var(--text-dim); font-size: 10px; cursor: pointer; margin-top: 4px; user-select: none;
}
.tool-card-toggle:hover { color: var(--amber); }

.thinking-indicator {
  display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px;
  font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--amber-dim); letter-spacing: 1px;
}
.thinking-cube {
  width: 8px; height: 8px; background: var(--amber);
  animation: pulse-cube 1.5s ease-in-out infinite;
}
@keyframes pulse-cube {
  0%, 100% { transform: scale(0.8); opacity: 0.5; }
  50% { transform: scale(1.2); opacity: 1; }
}

#chat-input-bar { display: flex; gap: 8px; padding-top: 12px; border-top: 1px solid var(--border); }
#chat-input {
  flex: 1; font-family: 'JetBrains Mono', monospace; font-size: 13px; padding: 12px 14px;
  background: var(--bg-input); border: 1px solid var(--border); color: var(--text-primary);
  outline: none; resize: none;
}
#chat-input:focus { border-color: var(--amber); }
#chat-input::placeholder { color: var(--text-dim); }
.send-btn {
  font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 700;
  letter-spacing: 1px; text-transform: uppercase; padding: 12px 20px;
  background: var(--amber); color: #000; border: none; cursor: pointer; transition: background 0.15s;
  align-self: flex-end;
}
.send-btn:hover { background: var(--amber-bright); }
.send-btn:disabled { opacity: 0.4; cursor: default; }
.cancel-btn {
  font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 700;
  letter-spacing: 1px; text-transform: uppercase; padding: 12px 16px;
  background: transparent; color: var(--error-text); border: 1px solid rgba(239,68,68,0.3);
  cursor: pointer; transition: all 0.15s; align-self: flex-end;
}
.cancel-btn:hover { background: var(--error-bg); }

#chat-status {
  font-family: 'JetBrains Mono', monospace; font-size: 10px;
  color: var(--text-dim); padding: 6px 0; letter-spacing: 0.5px;
}

.config-section {
  background: var(--bg-card); border: 1px solid var(--border); margin-bottom: 16px;
}
.config-section-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 16px; border-bottom: 1px solid var(--border); cursor: pointer; user-select: none;
}
.config-section-header:hover { background: var(--row-hover); }
.config-section-title {
  font-family: 'Syne', sans-serif; font-size: 13px; font-weight: 600;
  letter-spacing: 1px; text-transform: uppercase;
}
.config-section-toggle {
  font-family: 'JetBrains Mono', monospace; font-size: 11px;
  color: var(--text-dim); transition: transform 0.2s;
}
.config-section-body { padding: 16px; }
.config-row {
  display: flex; align-items: center; padding: 8px 0; gap: 16px;
  border-bottom: 1px solid rgba(31,31,31,0.5);
}
.config-row:last-child { border-bottom: none; }
.config-label {
  min-width: 180px; font-family: 'Outfit', sans-serif; font-size: 13px; color: var(--text-primary);
}
.config-value { flex: 1; max-width: 400px; }
.config-input {
  width: 100%; font-family: 'JetBrains Mono', monospace; font-size: 12px; padding: 8px 10px;
  background: var(--bg-input); border: 1px solid var(--border); color: var(--text-primary); outline: none;
}
.config-input:focus { border-color: var(--amber); }
.config-input[type="number"] { max-width: 120px; }

.toggle {
  width: 40px; height: 22px; background: #333; border-radius: 11px;
  position: relative; cursor: pointer; transition: background 0.2s;
}
.toggle.on { background: var(--amber); }
.toggle .toggle-knob {
  width: 16px; height: 16px; background: #fff; border-radius: 50%;
  position: absolute; top: 3px; left: 3px; transition: left 0.2s;
}
.toggle.on .toggle-knob { left: 21px; }

.config-select {
  font-family: 'JetBrains Mono', monospace; font-size: 12px; padding: 8px 10px;
  background: var(--bg-input); border: 1px solid var(--border); color: var(--text-primary);
  outline: none; cursor: pointer;
}
.config-select:focus { border-color: var(--amber); }

.save-bar { display: flex; justify-content: flex-end; gap: 8px; padding: 16px 0; }
.btn-primary {
  font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 700;
  letter-spacing: 1px; text-transform: uppercase; padding: 10px 20px;
  background: var(--amber); color: #000; border: none; cursor: pointer;
}
.btn-primary:hover { background: var(--amber-bright); }
.btn-secondary {
  font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 500;
  letter-spacing: 1px; text-transform: uppercase; padding: 10px 20px;
  background: transparent; color: var(--text-dim); border: 1px solid var(--border); cursor: pointer;
}
.btn-secondary:hover { color: var(--text-primary); border-color: var(--text-dim); }
.btn-danger {
  font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 700;
  letter-spacing: 1px; text-transform: uppercase; padding: 10px 20px;
  background: transparent; color: var(--error-text); border: 1px solid rgba(239,68,68,0.3); cursor: pointer;
}
.btn-danger:hover { background: var(--error-bg); }

.memory-toolbar { display: flex; gap: 8px; margin-bottom: 16px; align-items: center; }
.memory-toolbar input {
  flex: 1; font-family: 'JetBrains Mono', monospace; font-size: 12px; padding: 8px 12px;
  background: var(--bg-input); border: 1px solid var(--border); color: var(--text-primary); outline: none;
}
.memory-toolbar input:focus { border-color: var(--amber); }

.memory-list { background: var(--bg-card); border: 1px solid var(--border); }
.memory-row {
  display: flex; align-items: flex-start; padding: 12px 16px;
  border-bottom: 1px solid var(--border); cursor: pointer; transition: background 0.15s; gap: 16px;
}
.memory-row:last-child { border-bottom: none; }
.memory-row:hover { background: var(--row-hover); }
.memory-row.selected { background: rgba(245,158,11,0.06); border-left: 2px solid var(--amber); }
.memory-key {
  font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 600;
  color: var(--amber-bright); min-width: 200px; word-break: break-all;
}
.memory-category {
  font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 1px;
  text-transform: uppercase; color: var(--text-dim); min-width: 80px;
}
.memory-preview {
  flex: 1; font-size: 12px; color: var(--text-dim);
  overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
}

.memory-detail {
  background: var(--bg-card); border: 1px solid var(--border-amber); padding: 20px; margin-top: 16px;
}
.memory-detail-header {
  display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;
}
.memory-detail-key {
  font-family: 'JetBrains Mono', monospace; font-size: 14px; font-weight: 600; color: var(--amber);
}
.memory-detail-content {
  font-family: 'JetBrains Mono', monospace; font-size: 12px; line-height: 1.6;
  color: var(--text-primary); white-space: pre-wrap; word-break: break-word;
  background: var(--bg-input); border: 1px solid var(--border); padding: 14px;
  max-height: 300px; overflow-y: auto;
}
.memory-detail-meta {
  display: flex; gap: 20px; margin-top: 12px;
  font-family: 'JetBrains Mono', monospace; font-size: 10px;
  color: var(--text-dim); letter-spacing: 0.5px;
}

.memory-form {
  background: var(--bg-card); border: 1px solid var(--border); padding: 16px; margin-bottom: 16px;
  display: none;
}
.memory-form.visible { display: block; }
.memory-form-row { display: flex; gap: 8px; margin-bottom: 8px; align-items: center; }
.memory-form-row label {
  font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 1px;
  text-transform: uppercase; color: var(--text-dim); min-width: 80px;
}
.memory-form-row input, .memory-form-row textarea {
  flex: 1; font-family: 'JetBrains Mono', monospace; font-size: 12px; padding: 8px 10px;
  background: var(--bg-input); border: 1px solid var(--border); color: var(--text-primary); outline: none;
}
.memory-form-row input:focus, .memory-form-row textarea:focus { border-color: var(--amber); }
.memory-form-row textarea { min-height: 80px; resize: vertical; }

.tool-list-item {
  background: var(--bg-card); border: 1px solid var(--border); padding: 14px 18px;
  margin-bottom: 8px; transition: border-color 0.15s;
}
.tool-list-item:hover { border-color: var(--border-amber); }
.tool-name {
  font-family: 'JetBrains Mono', monospace; font-size: 14px; font-weight: 600;
  color: var(--amber); margin-bottom: 4px;
}
.tool-desc { font-size: 13px; color: var(--text-dim); line-height: 1.5; margin-bottom: 8px; }
.tool-params {
  font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--text-dim);
  background: var(--bg-input); padding: 8px 10px; border: 1px solid var(--border);
  max-height: 100px; overflow-y: auto; white-space: pre-wrap; display: none;
}
.tool-params.visible { display: block; }
.tool-params-toggle {
  font-family: 'JetBrains Mono', monospace; font-size: 10px;
  color: var(--text-dim); cursor: pointer; user-select: none;
}
.tool-params-toggle:hover { color: var(--amber); }

.stat-grid { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 24px; }
.stat-card {
  background: var(--bg-card); border: 1px solid var(--border);
  padding: 16px 20px; min-width: 160px; flex: 1;
}
.stat-label {
  font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 1px;
  text-transform: uppercase; color: var(--text-dim); margin-bottom: 6px;
}
.stat-value {
  font-family: 'JetBrains Mono', monospace; font-size: 22px; font-weight: 700; color: var(--amber);
}
.stat-value.small { font-size: 14px; }

.empty-state {
  display: flex; flex-direction: column; align-items: center;
  justify-content: center; padding: 60px 20px; color: var(--text-dim);
}
.empty-state-icon { font-size: 32px; margin-bottom: 12px; opacity: 0.3; }
.empty-state-text {
  font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 1px;
}

#toast {
  position: fixed; bottom: 24px; right: 24px;
  background: var(--bg-card); border: 1px solid var(--border-amber);
  padding: 12px 20px; font-family: 'JetBrains Mono', monospace; font-size: 12px;
  color: var(--amber); z-index: 10000;
  transform: translateY(100px); opacity: 0; transition: all 0.3s;
}
#toast.visible { transform: translateY(0); opacity: 1; }
#toast.error { border-color: rgba(239,68,68,0.3); color: var(--error-text); }
</style>
</head>
<body>

<div id="sidebar" class="expanded">
  <div class="logo" onclick="toggleSidebar()">
    <span class="logo-icon">ZC</span>
    <span class="logo-text">GATEWAY</span>
  </div>
  <div style="padding: 6px 0;">
    <div class="nav-item active" data-view="chat" onclick="switchView('chat')">
      <span class="nav-icon">&#x27E9;_</span><span class="nav-label">INTERACT</span>
    </div>
    <div class="nav-item" data-view="config" onclick="switchView('config')">
      <span class="nav-icon">&#x2699;</span><span class="nav-label">CONFIG</span>
    </div>
    <div class="nav-item" data-view="memory" onclick="switchView('memory')">
      <span class="nav-icon">&#x25C7;</span><span class="nav-label">MEMORY</span>
    </div>
    <div class="nav-item" data-view="tools" onclick="switchView('tools')">
      <span class="nav-icon">&#x25A4;</span><span class="nav-label">TOOLS</span>
    </div>
    <div class="nav-item" data-view="status" onclick="switchView('status')">
      <span class="nav-icon">&#x25CB;</span><span class="nav-label">STATUS</span>
    </div>
  </div>
  <div id="sidebar-bottom">
    <div id="sidebar-status">
      <span class="status-dot" id="health-dot"></span>
      <span id="health-text">NO INSTANCE</span>
    </div>
  </div>
</div>

<div id="main">
  <div id="header">
    <span id="page-title">INTERACT</span>
    <div id="instance-selector">
      <label>INSTANCE</label>
      <select id="instance-select" class="clip-sm" onchange="onInstanceChange()">
        <option value="">-- select --</option>
      </select>
    </div>
  </div>

  <div id="login-view">
    <div class="login-card clip">
      <h2>ZC//GW</h2>
      <p>Enter gateway auth token</p>
      <input id="login-token" type="password" placeholder="token" class="clip-sm"
        onkeydown="if(event.key==='Enter')doLogin()">
      <button class="clip-sm" onclick="doLogin()">AUTHENTICATE</button>
      <div class="login-error" id="login-error"></div>
    </div>
  </div>

  <div id="content" style="display:none">
    <div id="view-chat" class="view-panel" style="display:flex; flex-direction:column; height:100%;">
      <div id="chat-messages"></div>
      <div id="chat-status"></div>
      <div id="chat-input-bar">
        <textarea id="chat-input" class="clip-sm" rows="1" placeholder="Send a message..."
          onkeydown="handleChatKey(event)"></textarea>
        <button class="send-btn clip-sm" id="send-btn" onclick="sendMessage()">SEND</button>
      </div>
    </div>

    <div id="view-config" class="view-panel" style="display:none">
      <div id="config-content"></div>
      <div class="save-bar">
        <button class="btn-secondary clip-sm" onclick="loadConfig()">RELOAD</button>
        <button class="btn-primary clip-sm" onclick="saveConfig()">SAVE CHANGES</button>
      </div>
    </div>

    <div id="view-memory" class="view-panel" style="display:none">
      <div class="memory-toolbar">
        <input id="memory-search" class="clip-sm" placeholder="Search memory..." onkeydown="if(event.key==='Enter')searchMemory()">
        <button class="btn-secondary clip-sm" onclick="searchMemory()">SEARCH</button>
        <button class="btn-secondary clip-sm" onclick="loadMemory()">LIST ALL</button>
        <button class="btn-primary clip-sm" onclick="toggleMemoryForm()">+ STORE</button>
      </div>
      <div id="memory-form" class="memory-form clip">
        <div class="memory-form-row">
          <label>KEY</label>
          <input id="mem-key" class="clip-sm" placeholder="memory-key">
        </div>
        <div class="memory-form-row">
          <label>CATEGORY</label>
          <input id="mem-category" class="clip-sm" placeholder="general">
        </div>
        <div class="memory-form-row">
          <label>CONTENT</label>
          <textarea id="mem-content" class="clip-sm" placeholder="Memory content..."></textarea>
        </div>
        <div style="display:flex; gap:8px; justify-content:flex-end; margin-top:8px;">
          <button class="btn-secondary clip-sm" onclick="toggleMemoryForm()">CANCEL</button>
          <button class="btn-primary clip-sm" onclick="storeMemory()">STORE</button>
        </div>
      </div>
      <div id="memory-list" class="memory-list clip"></div>
      <div id="memory-detail"></div>
    </div>

    <div id="view-tools" class="view-panel" style="display:none">
      <div id="tools-list"></div>
    </div>

    <div id="view-status" class="view-panel" style="display:none">
      <div id="status-content"></div>
    </div>
  </div>
</div>

<div id="toast" class="clip-sm"></div>

<script>
'use strict';

var authToken = '';
var currentInstance = '';
var currentView = 'chat';
var ws = null;
var streaming = false;
var currentAssistantEl = null;
var currentToolCards = [];
var configData = null;
var selectedMemoryKey = null;

function getBase() { return location.origin; }

function headers() {
  return { 'Authorization': 'Bearer ' + authToken, 'Content-Type': 'application/json' };
}

function apiFetch(path, opts) {
  opts = opts || {};
  var h = headers();
  if (opts.headers) { for (var k in opts.headers) h[k] = opts.headers[k]; }
  opts.headers = h;
  return fetch(getBase() + path, opts).then(function(resp) {
    if (resp.status === 401) { logout(); throw new Error('Unauthorized'); }
    return resp;
  });
}

/* ── DOM helpers ── */
function el(tag, cls, text) {
  var e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}
function addChild(parent, tag, cls, text) {
  var c = el(tag, cls, text);
  parent.appendChild(c);
  return c;
}

/* ── Toast ── */
function toast(msg, isError) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'clip-sm visible' + (isError ? ' error' : '');
  clearTimeout(t._timeout);
  t._timeout = setTimeout(function() { t.className = 'clip-sm'; }, 3000);
}

/* ── Login ── */
function doLogin() {
  var token = document.getElementById('login-token').value.trim();
  if (!token) return;
  authToken = token;
  apiFetch('/api/instances').then(function(resp) {
    if (!resp.ok) throw new Error('Invalid token');
    return resp.json();
  }).then(function(data) {
    document.getElementById('login-view').style.display = 'none';
    document.getElementById('content').style.display = 'block';
    populateInstances(data);
    if (data.length > 0) {
      document.getElementById('instance-select').value = data[0].id;
      onInstanceChange();
    }
  }).catch(function(e) {
    document.getElementById('login-error').textContent = e.message;
    authToken = '';
  });
}

function logout() {
  authToken = '';
  currentInstance = '';
  if (ws) { ws.close(); ws = null; }
  document.getElementById('login-view').style.display = 'flex';
  document.getElementById('content').style.display = 'none';
  document.getElementById('login-token').value = '';
  document.getElementById('login-error').textContent = '';
}

/* ── Instances ── */
function populateInstances(instances) {
  var sel = document.getElementById('instance-select');
  while (sel.options.length > 1) sel.remove(1);
  instances.forEach(function(inst) {
    var opt = document.createElement('option');
    opt.value = inst.id;
    opt.textContent = inst.display_name;
    sel.appendChild(opt);
  });
}

function onInstanceChange() {
  currentInstance = document.getElementById('instance-select').value;
  if (ws) { ws.close(); ws = null; }
  if (!currentInstance) { updateHealthDot('unknown'); return; }
  connectWs();
  refreshCurrentView();
}

function refreshCurrentView() {
  if (!currentInstance) return;
  switch (currentView) {
    case 'chat': loadHistory(); break;
    case 'config': loadConfig(); break;
    case 'memory': loadMemory(); break;
    case 'tools': loadTools(); break;
    case 'status': loadStatus(); break;
  }
}

/* ── Sidebar ── */
function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('expanded');
}

function switchView(view) {
  currentView = view;
  document.querySelectorAll('.nav-item').forEach(function(e) {
    e.classList.toggle('active', e.dataset.view === view);
  });
  document.querySelectorAll('.view-panel').forEach(function(e) {
    e.style.display = 'none';
  });
  var viewEl = document.getElementById('view-' + view);
  if (viewEl) viewEl.style.display = (view === 'chat') ? 'flex' : 'block';
  var titles = { chat: 'INTERACT', config: 'CONFIGURATION', memory: 'MEMORY', tools: 'TOOLS', status: 'STATUS' };
  document.getElementById('page-title').textContent = titles[view] || view.toUpperCase();
  refreshCurrentView();
}

/* ── Health ── */
function updateHealthDot(status) {
  document.getElementById('health-dot').className = 'status-dot ' + (status || '');
  var labels = { healthy: 'CONNECTED', unhealthy: 'UNHEALTHY', unknown: 'UNKNOWN' };
  document.getElementById('health-text').textContent = currentInstance ? (labels[status] || 'UNKNOWN') : 'NO INSTANCE';
}

/* ── WebSocket ── */
function connectWs() {
  if (ws) ws.close();
  if (!currentInstance) return;
  var proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  var url = proto + '//' + location.host + '/ws/chat?instance=' + encodeURIComponent(currentInstance) + '&token=' + encodeURIComponent(authToken);
  ws = new WebSocket(url);
  ws.onopen = function() { updateHealthDot('healthy'); setChatStatus('Connected'); };
  ws.onmessage = function(e) { handleWsMessage(JSON.parse(e.data)); };
  ws.onclose = function() { updateHealthDot('unknown'); setChatStatus('Disconnected'); streaming = false; updateSendButton(); };
  ws.onerror = function() { updateHealthDot('unhealthy'); setChatStatus('Connection error'); };
}

function handleWsMessage(msg) {
  switch (msg.type) {
    case 'delta':
      if (!currentAssistantEl) currentAssistantEl = addChatMessage('assistant', '');
      var contentEl = currentAssistantEl.querySelector('.msg-content');
      contentEl.appendChild(document.createTextNode(msg.content));
      scrollChat();
      break;

    case 'tool_start':
      if (!currentAssistantEl) currentAssistantEl = addChatMessage('assistant', '');
      var card = createToolCard(msg.tool, msg.arguments, 'running');
      currentAssistantEl.querySelector('.msg-content').appendChild(card);
      currentToolCards.push({ tool: msg.tool, el: card });
      scrollChat();
      break;

    case 'tool_result':
      var existing = null;
      for (var i = 0; i < currentToolCards.length; i++) {
        if (currentToolCards[i].tool === msg.tool) { existing = currentToolCards[i]; break; }
      }
      if (existing) {
        updateToolCard(existing.el, msg.success, msg.output);
      } else {
        if (!currentAssistantEl) currentAssistantEl = addChatMessage('assistant', '');
        var rc = createToolCard(msg.tool, '', msg.success ? 'success' : 'fail');
        var rb = rc.querySelector('.tool-card-body');
        if (rb) rb.textContent = msg.output || '';
        currentAssistantEl.querySelector('.msg-content').appendChild(rc);
      }
      scrollChat();
      break;

    case 'done':
      if (msg.content && currentAssistantEl) {
        var ce = currentAssistantEl.querySelector('.msg-content');
        var hasText = false;
        for (var n = ce.firstChild; n; n = n.nextSibling) {
          if (n.nodeType === 3 && n.textContent.trim()) { hasText = true; break; }
        }
        if (!hasText) ce.insertBefore(document.createTextNode(msg.content), ce.firstChild);
      }
      currentAssistantEl = null;
      currentToolCards = [];
      streaming = false;
      updateSendButton();
      setChatStatus('Tokens: ' + (msg.input_tokens || 0) + ' in / ' + (msg.output_tokens || 0) + ' out');
      break;

    case 'error':
      addChatMessage('error', msg.message);
      currentAssistantEl = null;
      currentToolCards = [];
      streaming = false;
      updateSendButton();
      break;

    case 'queued':
      setChatStatus('Queued \u2014 position ' + msg.position);
      break;

    case 'turn_start':
      streaming = true;
      updateSendButton();
      setChatStatus('Processing...');
      break;

    case 'status':
      if (msg.busy) { streaming = true; updateSendButton(); }
      break;
  }
}

/* ── Chat UI ── */
function addChatMessage(role, text) {
  var row = el('div', 'chat-msg role-' + role);
  var sender = el('span', 'msg-sender');
  var content = el('span', 'msg-content');

  if (role === 'error') {
    sender.textContent = 'ERR';
    sender.style.color = 'var(--error-text)';
    content.textContent = text;
    content.style.color = 'var(--error-text)';
    row.style.borderLeftColor = '#ef4444';
    row.style.background = 'rgba(239,68,68,0.05)';
  } else {
    sender.textContent = role === 'user' ? 'YOU' : 'ZC';
    content.textContent = text;
  }

  row.appendChild(sender);
  row.appendChild(content);
  document.getElementById('chat-messages').appendChild(row);
  scrollChat();
  return row;
}

function createToolCard(toolName, args, status) {
  var card = el('div', 'tool-card clip-sm');

  var header = el('div', 'tool-card-header');
  addChild(header, 'span', 'tool-card-icon', '\u25B8');
  addChild(header, 'span', 'tool-card-name', toolName);
  var statusEl = addChild(header, 'span', 'tool-card-status ' + status);
  statusEl.textContent = status === 'running' ? 'RUNNING' : status === 'success' ? 'OK' : 'FAIL';
  card.appendChild(header);

  if (args) {
    var argsText;
    try { argsText = typeof args === 'string' ? args : JSON.stringify(args, null, 2); }
    catch(e) { argsText = String(args); }
    var body = addChild(card, 'div', 'tool-card-body', argsText);
  }

  var result = addChild(card, 'div', 'tool-card-body');
  result.style.display = 'none';
  result.dataset.role = 'result';

  if (status === 'running') {
    var indicator = el('div', 'thinking-indicator');
    addChild(indicator, 'div', 'thinking-cube');
    indicator.appendChild(document.createTextNode(' processing'));
    card.appendChild(indicator);
  }
  return card;
}

function updateToolCard(card, success, output) {
  var statusEl = card.querySelector('.tool-card-status');
  if (statusEl) {
    statusEl.className = 'tool-card-status ' + (success ? 'success' : 'fail');
    statusEl.textContent = success ? 'OK' : 'FAIL';
  }
  var indicator = card.querySelector('.thinking-indicator');
  if (indicator) indicator.remove();

  if (output) {
    var resultEl = card.querySelector('[data-role="result"]');
    if (resultEl) {
      resultEl.style.display = 'block';
      resultEl.style.marginTop = '6px';
      resultEl.style.borderTop = '1px solid var(--border)';
      resultEl.style.paddingTop = '6px';
      var truncated = output.length > 500 ? output.substring(0, 500) + '...' : output;
      resultEl.textContent = truncated;

      if (output.length > 500) {
        var toggle = el('div', 'tool-card-toggle', '[ show full output ]');
        toggle.addEventListener('click', function() {
          if (resultEl.textContent === output) {
            resultEl.textContent = truncated;
            toggle.textContent = '[ show full output ]';
          } else {
            resultEl.textContent = output;
            toggle.textContent = '[ collapse ]';
          }
        });
        card.appendChild(toggle);
      }
    }
  }
}

function scrollChat() {
  var e = document.getElementById('chat-messages');
  e.scrollTop = e.scrollHeight;
}
function setChatStatus(text) {
  document.getElementById('chat-status').textContent = text;
}

function updateSendButton() {
  var btn = document.getElementById('send-btn');
  if (streaming) {
    btn.textContent = 'CANCEL';
    btn.className = 'cancel-btn clip-sm';
    btn.onclick = cancelTurn;
  } else {
    btn.textContent = 'SEND';
    btn.className = 'send-btn clip-sm';
    btn.onclick = sendMessage;
  }
}

function handleChatKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    if (streaming) cancelTurn(); else sendMessage();
  }
}

function sendMessage() {
  var input = document.getElementById('chat-input');
  var text = input.value.trim();
  if (!text || !ws || ws.readyState !== WebSocket.OPEN) return;
  addChatMessage('user', text);
  currentAssistantEl = null;
  currentToolCards = [];
  ws.send(JSON.stringify({ type: 'message', content: text }));
  input.value = '';
  setChatStatus('Sending...');
}

function cancelTurn() {
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify({ type: 'cancel' }));
    streaming = false;
    updateSendButton();
    setChatStatus('Cancelled');
  }
}

/* ── History ── */
function loadHistory() {
  if (!currentInstance) return;
  apiFetch('/api/instances/' + encodeURIComponent(currentInstance) + '/history?limit=200').then(function(resp) {
    if (!resp.ok) return;
    return resp.json();
  }).then(function(data) {
    if (!data) return;
    var container = document.getElementById('chat-messages');
    container.textContent = '';
    if (data.messages && data.messages.length > 0) {
      data.messages.forEach(function(m) {
        addChatMessage(m.role === 'user' ? 'user' : 'assistant', m.content);
      });
    } else {
      var empty = el('div', 'empty-state');
      addChild(empty, 'div', 'empty-state-icon', '\u27E9_');
      addChild(empty, 'div', 'empty-state-text', 'No conversation history');
      container.appendChild(empty);
    }
  }).catch(function(e) {
    toast('Failed to load history: ' + e.message, true);
  });
}

/* ── Config ── */
function loadConfig() {
  if (!currentInstance) return;
  apiFetch('/api/instances/' + encodeURIComponent(currentInstance) + '/config').then(function(resp) {
    if (!resp.ok) throw new Error('Failed to load config');
    return resp.json();
  }).then(function(data) {
    configData = data;
    renderConfig(data);
  }).catch(function(e) {
    toast('Failed to load config: ' + e.message, true);
  });
}

function renderConfig(data) {
  var container = document.getElementById('config-content');
  container.textContent = '';

  if (!data || typeof data !== 'object') {
    var empty = el('div', 'empty-state');
    addChild(empty, 'div', 'empty-state-icon', '\u2699');
    addChild(empty, 'div', 'empty-state-text', 'No configuration data');
    container.appendChild(empty);
    return;
  }

  Object.keys(data).sort().forEach(function(sectionKey) {
    var val = data[sectionKey];
    var section = el('div', 'config-section clip');
    var isObject = val && typeof val === 'object' && !Array.isArray(val);

    var header = el('div', 'config-section-header');
    addChild(header, 'span', 'config-section-title', sectionKey);
    var toggleIcon = addChild(header, 'span', 'config-section-toggle', '\u25BC');

    var body = el('div', 'config-section-body');
    var collapsed = false;
    header.addEventListener('click', function() {
      collapsed = !collapsed;
      body.style.display = collapsed ? 'none' : 'block';
      toggleIcon.style.transform = collapsed ? 'rotate(-90deg)' : '';
    });

    if (isObject) {
      renderConfigFields(body, val, sectionKey);
    } else {
      renderConfigField(body, sectionKey, val, sectionKey);
    }

    section.appendChild(header);
    section.appendChild(body);
    container.appendChild(section);
  });
}

function renderConfigFields(container, obj, prefix) {
  Object.keys(obj).forEach(function(key) {
    var val = obj[key];
    var fullKey = prefix + '.' + key;

    if (val && typeof val === 'object' && !Array.isArray(val)) {
      var sub = el('div');
      sub.style.marginLeft = '16px';
      sub.style.marginBottom = '8px';
      var subLabel = el('div', null, key);
      subLabel.style.fontFamily = 'JetBrains Mono, monospace';
      subLabel.style.fontSize = '11px';
      subLabel.style.color = 'var(--amber-dim)';
      subLabel.style.letterSpacing = '1px';
      subLabel.style.textTransform = 'uppercase';
      subLabel.style.marginBottom = '6px';
      subLabel.style.paddingTop = '8px';
      subLabel.style.borderTop = '1px solid var(--border)';
      sub.appendChild(subLabel);
      renderConfigFields(sub, val, fullKey);
      container.appendChild(sub);
    } else {
      renderConfigField(container, key, val, fullKey);
    }
  });
}

function renderConfigField(container, label, value, dataKey) {
  var row = el('div', 'config-row');
  addChild(row, 'div', 'config-label', label);
  var valueEl = el('div', 'config-value');

  if (typeof value === 'boolean') {
    var toggle = el('div', 'toggle' + (value ? ' on' : ''));
    addChild(toggle, 'div', 'toggle-knob');
    toggle.dataset.key = dataKey;
    toggle.addEventListener('click', function() {
      var isOn = toggle.classList.toggle('on');
      setConfigValue(dataKey, isOn);
    });
    valueEl.appendChild(toggle);
  } else if (typeof value === 'number') {
    var input = el('input', 'config-input clip-sm');
    input.type = 'number';
    input.value = value;
    input.dataset.key = dataKey;
    input.addEventListener('change', function() { setConfigValue(dataKey, Number(input.value)); });
    valueEl.appendChild(input);
  } else if (Array.isArray(value)) {
    var input = el('input', 'config-input clip-sm');
    input.type = 'text';
    input.value = value.join(', ');
    input.dataset.key = dataKey;
    input.placeholder = 'comma-separated values';
    input.addEventListener('change', function() {
      setConfigValue(dataKey, input.value.split(',').map(function(s) { return s.trim(); }).filter(Boolean));
    });
    valueEl.appendChild(input);
  } else {
    var isSecret = /key|token|secret|password/i.test(label);
    var input = el('input', 'config-input clip-sm');
    input.type = isSecret ? 'password' : 'text';
    input.value = value != null ? String(value) : '';
    input.dataset.key = dataKey;
    input.addEventListener('change', function() { setConfigValue(dataKey, input.value); });
    valueEl.appendChild(input);
  }

  row.appendChild(valueEl);
  container.appendChild(row);
}

function setConfigValue(dotKey, value) {
  var parts = dotKey.split('.');
  var obj = configData;
  for (var i = 0; i < parts.length - 1; i++) {
    if (obj[parts[i]] === undefined) obj[parts[i]] = {};
    obj = obj[parts[i]];
  }
  obj[parts[parts.length - 1]] = value;
}

function saveConfig() {
  if (!currentInstance || !configData) return;
  apiFetch('/api/instances/' + encodeURIComponent(currentInstance) + '/config', {
    method: 'PUT',
    body: JSON.stringify(configData),
  }).then(function(resp) {
    if (!resp.ok) throw new Error('Save failed');
    return resp.json();
  }).then(function(result) {
    var msg = 'Config saved';
    if (result.updated_fields && result.updated_fields.length) {
      msg += ' (' + result.updated_fields.join(', ') + ')';
    }
    if (result.requires_restart) msg += ' \u2014 restart required';
    toast(msg);
  }).catch(function(e) {
    toast('Failed to save config: ' + e.message, true);
  });
}

/* ── Memory ── */
function loadMemory() {
  if (!currentInstance) return;
  apiFetch('/api/instances/' + encodeURIComponent(currentInstance) + '/memory?limit=200').then(function(resp) {
    if (!resp.ok) throw new Error('Failed to load memory');
    return resp.json();
  }).then(function(data) {
    renderMemoryList(data.entries || []);
  }).catch(function(e) {
    toast('Failed to load memory: ' + e.message, true);
  });
}

function searchMemory() {
  if (!currentInstance) return;
  var query = document.getElementById('memory-search').value.trim();
  if (!query) { loadMemory(); return; }
  apiFetch('/api/instances/' + encodeURIComponent(currentInstance) + '/memory/search?query=' + encodeURIComponent(query) + '&limit=50').then(function(resp) {
    if (!resp.ok) throw new Error('Search failed');
    return resp.json();
  }).then(function(data) {
    renderMemoryList(data.entries || []);
  }).catch(function(e) {
    toast('Failed to search memory: ' + e.message, true);
  });
}

function renderMemoryList(entries) {
  var container = document.getElementById('memory-list');
  container.textContent = '';

  if (!entries.length) {
    var empty = el('div', 'empty-state');
    addChild(empty, 'div', 'empty-state-icon', '\u25C7');
    addChild(empty, 'div', 'empty-state-text', 'No memory entries');
    container.appendChild(empty);
    document.getElementById('memory-detail').textContent = '';
    return;
  }

  entries.forEach(function(entry) {
    var row = el('div', 'memory-row' + (selectedMemoryKey === entry.key ? ' selected' : ''));
    addChild(row, 'span', 'memory-key', entry.key);
    addChild(row, 'span', 'memory-category', entry.category || '-');
    addChild(row, 'span', 'memory-preview', (entry.content || '').substring(0, 120));
    row.addEventListener('click', function() { selectMemory(entry, row); });
    container.appendChild(row);
  });
}

function selectMemory(entry, rowEl) {
  selectedMemoryKey = entry.key;
  document.querySelectorAll('.memory-row').forEach(function(r) { r.classList.remove('selected'); });
  rowEl.classList.add('selected');

  var detail = document.getElementById('memory-detail');
  detail.textContent = '';

  var panel = el('div', 'memory-detail clip');

  var header = el('div', 'memory-detail-header');
  addChild(header, 'span', 'memory-detail-key', entry.key);
  var actions = el('div');
  actions.style.display = 'flex';
  actions.style.gap = '8px';
  var copyBtn = el('button', 'btn-secondary clip-sm', 'COPY');
  copyBtn.addEventListener('click', function() {
    navigator.clipboard.writeText(entry.content || '').then(function() { toast('Copied to clipboard'); });
  });
  var delBtn = el('button', 'btn-danger clip-sm', 'DELETE');
  delBtn.addEventListener('click', function() { deleteMemory(entry.key); });
  actions.appendChild(copyBtn);
  actions.appendChild(delBtn);
  header.appendChild(actions);
  panel.appendChild(header);

  var content = el('div', 'memory-detail-content', entry.content || '');
  panel.appendChild(content);

  var meta = el('div', 'memory-detail-meta');
  addChild(meta, 'span', null, 'CATEGORY: ' + (entry.category || '-'));
  if (entry.timestamp) addChild(meta, 'span', null, 'TIMESTAMP: ' + entry.timestamp);
  if (entry.score != null) addChild(meta, 'span', null, 'SCORE: ' + entry.score.toFixed(3));
  panel.appendChild(meta);

  detail.appendChild(panel);
}

function deleteMemory(key) {
  if (!currentInstance || !key) return;
  apiFetch('/api/instances/' + encodeURIComponent(currentInstance) + '/memory/' + encodeURIComponent(key), { method: 'DELETE' }).then(function(resp) {
    if (!resp.ok) throw new Error('Delete failed');
    toast('Memory deleted');
    selectedMemoryKey = null;
    document.getElementById('memory-detail').textContent = '';
    loadMemory();
  }).catch(function(e) {
    toast('Failed to delete memory: ' + e.message, true);
  });
}

function toggleMemoryForm() {
  document.getElementById('memory-form').classList.toggle('visible');
}

function storeMemory() {
  if (!currentInstance) return;
  var key = document.getElementById('mem-key').value.trim();
  var content = document.getElementById('mem-content').value.trim();
  var category = document.getElementById('mem-category').value.trim() || 'general';
  if (!key || !content) { toast('Key and content are required', true); return; }
  apiFetch('/api/instances/' + encodeURIComponent(currentInstance) + '/memory', {
    method: 'POST',
    body: JSON.stringify({ key: key, content: content, category: category }),
  }).then(function(resp) {
    if (!resp.ok) throw new Error('Store failed');
    toast('Memory stored');
    document.getElementById('mem-key').value = '';
    document.getElementById('mem-content').value = '';
    document.getElementById('mem-category').value = '';
    toggleMemoryForm();
    loadMemory();
  }).catch(function(e) {
    toast('Failed to store memory: ' + e.message, true);
  });
}

/* ── Tools ── */
function loadTools() {
  if (!currentInstance) return;
  apiFetch('/api/instances/' + encodeURIComponent(currentInstance) + '/tools').then(function(resp) {
    if (!resp.ok) throw new Error('Failed to load tools');
    return resp.json();
  }).then(function(data) {
    renderTools(data.tools || []);
  }).catch(function(e) {
    toast('Failed to load tools: ' + e.message, true);
  });
}

function renderTools(tools) {
  var container = document.getElementById('tools-list');
  container.textContent = '';

  if (!tools.length) {
    var empty = el('div', 'empty-state');
    addChild(empty, 'div', 'empty-state-icon', '\u25A4');
    addChild(empty, 'div', 'empty-state-text', 'No tools available');
    container.appendChild(empty);
    return;
  }

  tools.forEach(function(tool) {
    var item = el('div', 'tool-list-item clip');
    addChild(item, 'div', 'tool-name', tool.name);
    addChild(item, 'div', 'tool-desc', tool.description || '');

    if (tool.parameters) {
      var paramsStr = JSON.stringify(tool.parameters, null, 2);
      var toggle = el('div', 'tool-params-toggle', '\u25B8 parameters');
      var params = el('div', 'tool-params clip-sm', paramsStr);
      toggle.addEventListener('click', function() { params.classList.toggle('visible'); });
      item.appendChild(toggle);
      item.appendChild(params);
    }
    container.appendChild(item);
  });
}

/* ── Status ── */
function loadStatus() {
  if (!currentInstance) return;
  apiFetch('/api/instances/' + encodeURIComponent(currentInstance) + '/status').then(function(resp) {
    if (!resp.ok) throw new Error('Failed to load status');
    return resp.json();
  }).then(function(data) {
    renderStatus(data);
  }).catch(function(e) {
    toast('Failed to load status: ' + e.message, true);
  });
}

function renderStatus(data) {
  var container = document.getElementById('status-content');
  container.textContent = '';

  var uptime = data.uptime_secs ? formatUptime(data.uptime_secs) : '-';

  var grid1 = el('div', 'stat-grid');
  grid1.appendChild(makeStatCard('STATE', data.state || '-'));
  grid1.appendChild(makeStatCard('UPTIME', uptime));
  grid1.appendChild(makeStatCard('TOTAL TURNS', String(data.total_turns || 0)));
  grid1.appendChild(makeStatCard('HISTORY', String(data.history_length || 0)));
  container.appendChild(grid1);

  var grid2 = el('div', 'stat-grid');
  grid2.appendChild(makeStatCard('MODEL', data.model || '-', true));
  grid2.appendChild(makeStatCard('PROVIDER', data.provider || '-', true));
  container.appendChild(grid2);

  var bar = el('div', 'save-bar');
  var refreshBtn = el('button', 'btn-secondary clip-sm', 'REFRESH');
  refreshBtn.addEventListener('click', loadStatus);
  var clearBtn = el('button', 'btn-danger clip-sm', 'CLEAR HISTORY');
  clearBtn.addEventListener('click', clearHistory);
  bar.appendChild(refreshBtn);
  bar.appendChild(clearBtn);
  container.appendChild(bar);
}

function makeStatCard(label, value, small) {
  var card = el('div', 'stat-card clip');
  addChild(card, 'div', 'stat-label', label);
  addChild(card, 'div', 'stat-value' + (small ? ' small' : ''), value);
  return card;
}

function formatUptime(secs) {
  var d = Math.floor(secs / 86400);
  var h = Math.floor((secs % 86400) / 3600);
  var m = Math.floor((secs % 3600) / 60);
  if (d > 0) return d + 'd ' + h + 'h ' + m + 'm';
  if (h > 0) return h + 'h ' + m + 'm';
  return m + 'm ' + (secs % 60) + 's';
}

function clearHistory() {
  if (!currentInstance) return;
  apiFetch('/api/instances/' + encodeURIComponent(currentInstance) + '/history', { method: 'DELETE' }).then(function(resp) {
    if (!resp.ok) throw new Error('Failed to clear');
    return resp.json();
  }).then(function(data) {
    toast('Cleared ' + (data.messages_cleared || 0) + ' messages');
    document.getElementById('chat-messages').textContent = '';
    loadStatus();
  }).catch(function(e) {
    toast('Failed to clear history: ' + e.message, true);
  });
}
</script>
</body>
</html>
