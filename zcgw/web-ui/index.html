<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ZeroClaw Gateway</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f1117; color: #e0e0e0; height: 100vh; display: flex; flex-direction: column; }
  header { background: #1a1d27; padding: 12px 20px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid #2a2d37; }
  header h1 { font-size: 16px; font-weight: 600; color: #7c8aff; }
  .controls { display: flex; gap: 8px; align-items: center; margin-left: auto; }
  input, select, button { font-size: 13px; padding: 6px 10px; border-radius: 6px; border: 1px solid #2a2d37; background: #1a1d27; color: #e0e0e0; }
  input:focus, select:focus { outline: none; border-color: #7c8aff; }
  button { background: #7c8aff; color: #fff; border: none; cursor: pointer; font-weight: 500; }
  button:hover { background: #6b79ee; }
  button:disabled { opacity: 0.5; cursor: default; }
  #chat { flex: 1; overflow-y: auto; padding: 16px 20px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 80%; padding: 10px 14px; border-radius: 10px; line-height: 1.5; white-space: pre-wrap; word-break: break-word; font-size: 14px; }
  .msg.user { align-self: flex-end; background: #2a3a6a; }
  .msg.assistant { align-self: flex-start; background: #1e2130; border: 1px solid #2a2d37; }
  .msg.tool { align-self: flex-start; background: #1a2a1a; border: 1px solid #2a3d2a; font-size: 12px; font-family: monospace; }
  .msg.error { align-self: center; background: #3a1a1a; border: 1px solid #5a2a2a; color: #ff7c7c; }
  .msg.system { align-self: center; color: #888; font-size: 12px; }
  footer { padding: 12px 20px; background: #1a1d27; border-top: 1px solid #2a2d37; display: flex; gap: 8px; }
  #input { flex: 1; padding: 10px 14px; }
  #status { font-size: 11px; color: #666; padding: 4px 20px; background: #1a1d27; }
</style>
</head>
<body>
  <header>
    <h1>ZeroClaw Gateway</h1>
    <div class="controls">
      <input id="token" type="password" placeholder="Auth token" style="width:160px">
      <select id="instance"><option value="">Select instance...</option></select>
      <button id="connectBtn" onclick="connect()">Connect</button>
      <button onclick="loadHistory()">History</button>
    </div>
  </header>
  <div id="status">Disconnected</div>
  <div id="chat"></div>
  <footer>
    <input id="input" type="text" placeholder="Type a message..." onkeydown="if(event.key==='Enter')send()">
    <button onclick="send()">Send</button>
  </footer>

<script>
let ws = null;
let currentAssistantEl = null;

function getBase() {
  return location.origin;
}

function getToken() {
  return document.getElementById('token').value;
}

function setStatus(text) {
  document.getElementById('status').textContent = text;
}

function clearChat() {
  const chat = document.getElementById('chat');
  while (chat.firstChild) {
    chat.removeChild(chat.firstChild);
  }
}

function addMsg(role, text) {
  const chat = document.getElementById('chat');
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  div.textContent = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  return div;
}

document.getElementById('token').addEventListener('change', async function() {
  try {
    const resp = await fetch(getBase() + '/api/instances', {
      headers: { 'Authorization': 'Bearer ' + getToken() }
    });
    if (!resp.ok) { setStatus('Failed to load instances: ' + resp.status); return; }
    const data = await resp.json();
    const sel = document.getElementById('instance');
    while (sel.options.length > 1) { sel.remove(1); }
    data.forEach(function(inst) {
      const opt = document.createElement('option');
      opt.value = inst.id;
      opt.textContent = inst.display_name + ' (' + inst.health + ')';
      sel.appendChild(opt);
    });
  } catch(e) {
    setStatus('Error: ' + e.message);
  }
});

function connect() {
  const token = getToken();
  const instance = document.getElementById('instance').value;
  if (!instance) { setStatus('Select an instance'); return; }

  if (ws) { ws.close(); }

  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  const url = proto + '//' + location.host + '/ws/chat?instance=' + encodeURIComponent(instance) + '&token=' + encodeURIComponent(token);
  ws = new WebSocket(url);

  ws.onopen = function() {
    setStatus('Connected to ' + instance);
    addMsg('system', 'Connected to ' + instance);
  };

  ws.onmessage = function(e) {
    const msg = JSON.parse(e.data);
    switch(msg.type) {
      case 'delta':
        if (!currentAssistantEl) {
          currentAssistantEl = addMsg('assistant', '');
        }
        currentAssistantEl.textContent += msg.content;
        document.getElementById('chat').scrollTop = document.getElementById('chat').scrollHeight;
        break;
      case 'tool_start':
        addMsg('tool', 'Tool: ' + msg.tool + '\nArgs: ' + msg.arguments);
        break;
      case 'tool_result':
        addMsg('tool', 'Result (' + msg.tool + '): ' + (msg.success ? 'OK' : 'FAIL') + '\n' + msg.output);
        break;
      case 'done':
        if (msg.content) {
          if (!currentAssistantEl) {
            currentAssistantEl = addMsg('assistant', '');
          }
          if (currentAssistantEl.textContent === '') {
            currentAssistantEl.textContent = msg.content;
          }
        }
        currentAssistantEl = null;
        setStatus('Ready — tokens: ' + msg.input_tokens + ' in / ' + msg.output_tokens + ' out');
        break;
      case 'error':
        addMsg('error', 'Error: ' + msg.message);
        currentAssistantEl = null;
        break;
      case 'queued':
        setStatus('Queued at position ' + msg.position);
        break;
      case 'turn_start':
        setStatus('Processing...');
        break;
      default:
        break;
    }
  };

  ws.onclose = function() { setStatus('Disconnected'); };
  ws.onerror = function() { setStatus('WebSocket error'); };
}

function send() {
  const input = document.getElementById('input');
  const text = input.value.trim();
  if (!text || !ws || ws.readyState !== WebSocket.OPEN) return;
  addMsg('user', text);
  currentAssistantEl = null;
  ws.send(JSON.stringify({ type: 'message', content: text }));
  input.value = '';
  setStatus('Sending...');
}

async function loadHistory() {
  const token = getToken();
  const instance = document.getElementById('instance').value;
  if (!instance) { setStatus('Select an instance'); return; }

  try {
    const resp = await fetch(getBase() + '/api/instances/' + encodeURIComponent(instance) + '/history?limit=100', {
      headers: { 'Authorization': 'Bearer ' + token }
    });
    if (!resp.ok) { setStatus('Failed: ' + resp.status); return; }
    const data = await resp.json();
    clearChat();
    addMsg('system', 'History (' + data.total + ' messages)');
    data.messages.forEach(function(m) {
      addMsg(m.role === 'user' ? 'user' : 'assistant', m.content);
    });
  } catch(e) {
    setStatus('Error: ' + e.message);
  }
}
</script>
</body>
</html>
