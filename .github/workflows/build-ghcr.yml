name: Build & push to GHCR (debian)

on:
  push:
    branches:
      - fork-075
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The web dashboard's TypeScript client (web/src/lib/api-generated.ts)
      # is generated from the gateway's in-process OpenAPI spec by
      # `cargo xtask web gen-api`; it's gitignored, so npm run build inside
      # Dockerfile.debian's web-builder stage fails with TS2307 unless we
      # produce it here first. Mirrors upstream release-stable-manual.yml's
      # dedicated "Build Web Dashboard" job.
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.0
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Generate web API client
        run: cargo run -p xtask --bin web -- gen-api

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tag
        id: meta
        run: |
          sanitized=$(echo "${GITHUB_REF_NAME}" | tr '[:upper:]/' '[:lower:]-')
          short=$(git rev-parse --short=7 HEAD)
          echo "tag=${sanitized}-${short}-debian" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.debian
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ steps.meta.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
