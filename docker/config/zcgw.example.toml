# ─────────────────────────────────────────────────────────────
# ZeroClaw Gateway Config (zcgw)
# ─────────────────────────────────────────────────────────────
# Copy to zcgw.toml and adjust for your deployment.
# Each instance needs a [instances.<name>] section with its
# gRPC address and display name.

listen_addr = "0.0.0.0:8080"

[instances.my-agent]
grpc_address = "http://my-agent:50051"
display_name = "My Agent"
desired_state = "running"
