# ─────────────────────────────────────────────────────────────
# ZeroClaw Instance Config — Venice Provider
# ─────────────────────────────────────────────────────────────
# Copy this file and adjust for each instance.
# API key is passed via VENICE_API_KEY env var (see docker-compose.yml).

# ── Provider ────────────────────────────────────────────────
default_provider = "venice"
default_model = "minimax-m25"
default_temperature = 0.7
provider_timeout_secs = 120

# Model routing: direct task hints to specific models.
# The agent can use hint:fast, hint:reasoning, etc.
# If no hint matches, default_model is used.
model_routes = [
    { hint = "fast",      provider = "venice", model = "zai-org-glm-4.7-flash" },
    { hint = "reasoning", provider = "venice", model = "minimax-m25" },
    { hint = "code",      provider = "venice", model = "qwen3-coder-480b-a35b-instruct-turbo" },
    { hint = "creative",  provider = "venice", model = "openai-gpt-oss-120b" },
]

# ── Memory ──────────────────────────────────────────────────
[memory]
backend = "sqlite"
auto_save = true
auto_hydrate = true
min_relevance_score = 0.4
embedding_provider = "none"

# ── Agent Behavior ──────────────────────────────────────────
[agent]
compact_context = false
max_tool_iterations = 10
max_history_messages = 50

# ── Autonomy ────────────────────────────────────────────────
[autonomy]
level = "supervised"
workspace_only = true
max_actions_per_hour = 20
auto_approve = ["file_read", "memory_recall"]
allowed_commands = ["git", "npm", "cargo", "ls", "cat", "grep", "find", "echo", "pwd"]
forbidden_paths = [
    "/etc", "/root", "/usr", "/bin", "/sbin", "/lib", "/opt",
    "/boot", "/dev", "/proc", "/sys", "/var", "/tmp",
    "~/.ssh", "~/.gnupg", "~/.aws", "~/.config",
]
max_cost_per_day_cents = 500
require_approval_for_medium_risk = true
block_high_risk_commands = true
shell_env_passthrough = []
always_ask = []
allowed_roots = []
non_cli_excluded_tools = []

# ── Cron ────────────────────────────────────────────────────
[cron]
enabled = true
max_run_history = 50

# ── Security ────────────────────────────────────────────────
[secrets]
encrypt = true

[security.sandbox]
backend = "auto"
